<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BGMI Shop</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      padding-bottom: 40px;
    }

    header {
      padding: 18px;
      background: #111;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .menu {
      font-size: 25px;
    }

    .hero {
      padding: 30px 18px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #aaa;
      margin-bottom: 20px;
    }

    .search {
      width: 100%;
      padding: 16px;
      border-radius: 30px;
      border: 1px solid #444;
      background: #1a1a1a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    .filters {
      margin: 20px 18px;
      padding: 18px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
    }

    .filters h3 {
      margin-bottom: 12px;
    }

    .price {
      display: flex;
      gap: 10px;
    }

    .price input {
      width: 50%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #1b1b1b;
      color: white;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      padding: 0 18px;
    }

    .product {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 16px;
      padding: 14px;
    }

    .product-image {
      height: 120px;
      border-radius: 12px;
      background: #242424;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin-bottom: 12px;
    }

    .product h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .product p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .price-tag {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .buy {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    .contact {
      margin: 25px 18px;
      padding: 20px;
      text-align: center;
      background: #111;
      border: 1px solid #292929;
      border-radius: 18px;
    }

    .contact button {
      margin-top: 12px;
      padding: 13px 25px;
      border: none;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
    }

    @media (max-width: 450px) {
      .products {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎮 BGMI SHOP</div>
    <div class="menu">☰</div>
  </header>

  <section class="hero">
    <h1>BGMI Items Store</h1>
    <p>Find your gaming items easily</p>

    <input
      class="search"
      id="search"
      type="text"
      placeholder="🔍 Search products..."
      onkeyup="searchProducts()"
    >
  </section>

  <section class="filters">
    <h3>Price Filter</h3>

    <div class="price">
      <input type="number" id="minPrice" placeholder="Min ₹">
      <input type="number" id="maxPrice" placeholder="Max ₹">
    </div>
  </section>

  <section class="products" id="products">

    <div class="product" data-name="BGMI Item 1" data-price="99">
      <div class="product-image">🎁</div>
      <h3>BGMI Item 1</h3>
      <p>Gaming item</p>
      <div class="price-tag">₹99</div>
      <button class="buy" onclick="buyProduct('BGMI Item 1')">
        Buy Now
      </button>
    </div>

    <div class="product" data-name="BGMI Item 2" data-price="199">
      <div class="product-image">🎮</div>
      <h3>BGMI Item 2</h3>
      <p>Gaming item</p>
      <div class="price-tag">₹199</div>
      <button class="buy" onclick="buyProduct('BGMI Item 2')">
        Buy Now
      </button>
    </div>

    <div class="product" data-name="BGMI Item 3" data-price="299">
      <div class="product-image">🔥</div>
      <h3>BGMI Item 3</h3>
      <p>Gaming item</p>
      <div class="price-tag">₹299</div>
      <button class="buy" onclick="buyProduct('BGMI Item 3')">
        Buy Now
      </button>
    </div>

    <div class="product" data-name="BGMI Item 4" data-price="499">
      <div class="product-image">🏆</div>
      <h3>BGMI Item 4</h3>
      <p>Gaming item</p>
      <div class="price-tag">₹499</div>
      <button class="buy" onclick="buyProduct('BGMI Item 4')">
        Buy Now
      </button>
    </div>

  </section>

  <div class="contact">
    <h2>Need Help?</h2>
    <p>Contact us for your order.</p>
    <button onclick="contact()">Contact Seller</button>
  </div>

  <script>
    function searchProducts() {
      let search = document
        .getElementById("search")
        .value
        .toLowerCase();

      let products = document.querySelectorAll(".product");

      products.forEach(function(product) {
        let name = product
          .getAttribute("data-name")
          .toLowerCase();

        if (name.includes(search)) {
          product.style.display = "block";
        } else {
          product.style.display = "none";
        }
      });
    }

    function buyProduct(name) {
      alert("You selected: " + name);
    }

    function contact() {
      alert("Seller contact will be added here.");
    }
  </script>

</body>
</html>
